<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/jobwise-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JobWise — Autonomous AI Career Agent for Students, Job Seekers & Freelancers. Discover jobs, tailor resumes, analyze skill gaps, and practice mock interviews." />
    <title>JobWise — Your AI Career Companion</title>
    <!-- Preload Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Zero-FOUC Theme and Accent Initialization Script -->
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('jobwise_theme') || 'light';
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const mode = savedTheme === 'system' ? (prefersDark ? 'dark' : 'light') : savedTheme;
          document.documentElement.setAttribute('data-theme', mode);

          const savedAccent = localStorage.getItem('jobwise_accent_color');
          if (savedAccent) {
            document.documentElement.style.setProperty('--primary', savedAccent);
          }
        } catch (e) {
          console.error('Failed to initialize theme early', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
