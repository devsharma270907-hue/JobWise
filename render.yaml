services:
  # ── JobWise Backend API Service ──────────────────────────────────────────────
  - type: web
    name: jobwise-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        value: c805980b94597caf987f0a6b7208aa94275a462cf7e215678ecb3c3de17c0948
      - key: CLIENT_URL
        fromService:
          type: static
          name: jobwise-frontend
          property: url
      - key: CORS_ORIGINS
        fromService:
          type: static
          name: jobwise-frontend
          property: url
      - key: STORAGE_DRIVER
        value: local
      - key: UPLOAD_DIR
        value: ./uploads
      - key: ANTHROPIC_API_KEY
        value: mock_dev_key

  # ── JobWise Frontend Static Site ─────────────────────────────────────────────
  - type: static
    name: jobwise-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: jobwise-backend
          property: url
